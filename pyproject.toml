[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cpp-learning-agent"
version = "0.1.0"
description = "A safe, repository-aware C++ learning assistant built with LangGraph and the Responses API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2.0",
    "openai>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
]

[project.scripts]
cpp-agent = "cpp_learning_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
